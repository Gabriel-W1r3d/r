name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\ohm_player.exe dist\
          Copy-Item "Ohm Player.cmd" dist\
          Copy-Item Logo.jpg dist\
          Compress-Archive -Path dist\* -DestinationPath ohm-player-windows.zip -Force

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ohm-player-windows
          path: ohm-player-windows.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ohm-player-windows.zip
