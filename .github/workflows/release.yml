name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: pwsh
            artifact_name: ohm-player-0.3.0-windows
            package_file: ohm-player-0.3.0-windows.zip
            package_cmd: |
              New-Item -ItemType Directory -Force dist | Out-Null
              Copy-Item target\release\ohm_player.exe dist\
              Copy-Item "Ohm Player.cmd" dist\
              Copy-Item Logo.jpg dist\
              Compress-Archive -Path dist\* -DestinationPath ohm-player-0.3.0-windows.zip -Force

          - os: ubuntu-latest
            shell: bash
            artifact_name: ohm-player-0.3.0-linux
            package_file: ohm-player-0.3.0-linux.AppImage
            package_cmd: |
              set -eu
              mkdir -p dist/OhmPlayer.AppDir/usr/bin
              mkdir -p dist/OhmPlayer.AppDir/usr/share/icons/hicolor/256x256/apps
              cp target/release/ohm_player dist/OhmPlayer.AppDir/usr/bin/ohm_player
              convert Logo.jpg -resize 256x256 dist/OhmPlayer.AppDir/ohm_player.png
              cp dist/OhmPlayer.AppDir/ohm_player.png dist/OhmPlayer.AppDir/usr/share/icons/hicolor/256x256/apps/ohm_player.png
              cat > dist/OhmPlayer.AppDir/AppRun <<'EOF'
              #!/bin/sh
              DIR="$(cd "$(dirname "$0")" && pwd)"
              exec "$DIR/usr/bin/ohm_player" "$@"
              EOF
              cat > dist/OhmPlayer.AppDir/OhmPlayer.desktop <<'EOF'
              [Desktop Entry]
              Type=Application
              Name=Ohm Player
              Exec=ohm_player
              Icon=ohm_player
              Categories=AudioVideo;Audio;Player;Music;
              Terminal=false
              EOF
              chmod +x dist/OhmPlayer.AppDir/AppRun dist/OhmPlayer.AppDir/usr/bin/ohm_player
              curl -L -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
              chmod +x appimagetool.AppImage
              ./appimagetool.AppImage dist/OhmPlayer.AppDir ohm-player-0.3.0-linux.AppImage

          - os: macos-latest
            shell: bash
            artifact_name: ohm-player-0.3.0-macos
            package_file: ohm-player-0.3.0-macos.dmg
            package_cmd: |
              set -eu
              APP_DIR="dist/Ohm Player.app"
              mkdir -p "$APP_DIR/Contents/MacOS"
              mkdir -p "$APP_DIR/Contents/Resources"
              cp target/release/ohm_player "$APP_DIR/Contents/MacOS/ohm_player"
              cp Logo.jpg "$APP_DIR/Contents/Resources/Logo.jpg"
              ICONSET="dist/AppIcon.iconset"
              mkdir -p "$ICONSET"
              sips -z 16 16 Logo.jpg --out "$ICONSET/icon_16x16.png" >/dev/null
              sips -z 32 32 Logo.jpg --out "$ICONSET/icon_16x16@2x.png" >/dev/null
              sips -z 32 32 Logo.jpg --out "$ICONSET/icon_32x32.png" >/dev/null
              sips -z 64 64 Logo.jpg --out "$ICONSET/icon_32x32@2x.png" >/dev/null
              sips -z 128 128 Logo.jpg --out "$ICONSET/icon_128x128.png" >/dev/null
              sips -z 256 256 Logo.jpg --out "$ICONSET/icon_128x128@2x.png" >/dev/null
              sips -z 256 256 Logo.jpg --out "$ICONSET/icon_256x256.png" >/dev/null
              sips -z 512 512 Logo.jpg --out "$ICONSET/icon_256x256@2x.png" >/dev/null
              sips -z 512 512 Logo.jpg --out "$ICONSET/icon_512x512.png" >/dev/null
              iconutil -c icns "$ICONSET" -o "$APP_DIR/Contents/Resources/AppIcon.icns"
              cat > "$APP_DIR/Contents/Info.plist" <<'EOF'
              <?xml version="1.0" encoding="UTF-8"?>
              <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
              <plist version="1.0">
              <dict>
                  <key>CFBundleDevelopmentRegion</key>
                  <string>en</string>
                  <key>CFBundleDisplayName</key>
                  <string>Ohm Player</string>
                  <key>CFBundleExecutable</key>
                  <string>ohm_player</string>
                  <key>CFBundleIdentifier</key>
                  <string>com.ohmplayer.app</string>
                  <key>CFBundleName</key>
                  <string>Ohm Player</string>
                  <key>CFBundleIconFile</key>
                  <string>AppIcon</string>
                  <key>CFBundlePackageType</key>
                  <string>APPL</string>
                  <key>CFBundleShortVersionString</key>
                  <string>0.3.0</string>
                  <key>CFBundleVersion</key>
                  <string>0.3.0</string>
                  <key>LSMinimumSystemVersion</key>
                  <string>10.13</string>
                  <key>NSHighResolutionCapable</key>
                  <true/>
              </dict>
              </plist>
              EOF
              chmod +x "$APP_DIR/Contents/MacOS/ohm_player"
              hdiutil create -volname "Ohm Player 0.3.0" -srcfolder "$APP_DIR" -ov -format UDZO ohm-player-0.3.0-macos.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Package release
        shell: ${{ matrix.shell }}
        run: ${{ matrix.package_cmd }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.package_file }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/ohm-player-0.3.0-windows.zip
            release-assets/**/ohm-player-0.3.0-linux.AppImage
            release-assets/**/ohm-player-0.3.0-macos.dmg
